<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Game Plane</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#f1f5f9; --dim:#94a3b8; --acc:#38bdf8; --ok:#4ade80; --ko:#f87171; }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body { min-height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--txt); font: 16px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; position: sticky; top: 0;
           background: var(--bg); z-index: 25; }
  #hstatus { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 1.1rem; margin: 0; }
  #status { font-size: .85rem; color: var(--dim); }
  #status.ok { color: var(--ok); } #status.ko { color: var(--ko); }
  section { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  #login { display: flex; gap: 8px; }
  input, button { font: inherit; border-radius: 8px; border: 0; padding: 12px; }
  input { flex: 1; min-width: 0; background: #0b1220; color: var(--txt); }
  button { background: var(--acc); color: #04263a; font-weight: 600; }
  #players { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  #players li { background: #0b1220; border-radius: 999px; padding: 4px 12px; font-size: .9rem; }
  #players li.off { color: var(--dim); }
  #players li.me { outline: 1px solid var(--acc); }
  #players li.tap { cursor: pointer; }
  .hint { color: var(--dim); font-size: .8rem; margin: 8px 0 0; }

  /* Volet de chat global (lobby et jeux) */
  #chat-toggle { position: relative; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; padding: 0; flex: none; }
  #chat-badge { position: absolute; top: -4px; right: -4px; background: var(--ko); color: #fff; font-size: .75rem;
                min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; padding: 0 4px; font-size: .7rem; }
  #chat-panel { position: fixed; left: 0; right: 0; bottom: 0; height: 60dvh; z-index: 30; background: var(--card);
                border-radius: 16px 16px 0 0; box-shadow: 0 -4px 16px #0009; display: flex; flex-direction: column;
                padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
  #chat-head { display: flex; align-items: center; gap: 8px; }
  #chat-tabs { flex: 1; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .tab { white-space: nowrap; background: #0b1220; color: var(--txt); padding: 6px 12px; border-radius: 999px; font-weight: 400; }
  .tab.on { background: var(--acc); color: #04263a; font-weight: 600; }
  .tab .n { background: var(--ko); color: #fff; border-radius: 10px; margin-left: 6px; padding: 0 6px; font-size: .75rem; }
  #chat-close { background: transparent; color: var(--dim); padding: 6px 10px; font-size: 1.2rem; }
  #chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 4px 0; }
  #chat-log p { margin: 0; word-break: break-word; }
  #chat-log b { color: var(--acc); }
  #chat-log p.me b { color: var(--ok); }
  #chat-log p.sys { color: var(--dim); font-style: italic; }
  #chat-typing { height: 1.2em; font-size: .8rem; color: var(--dim); }
  #chat-quick { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
  #chat-quick button { background: #0b1220; color: var(--txt); padding: 6px 12px; font-weight: 400; white-space: nowrap; }
  #chat-form { display: flex; gap: 8px; margin-top: 4px; }
  h2 { font-size: .95rem; margin: 0 0 8px; color: var(--dim); font-weight: 600; }
  .game-card, #tables li { display: flex; justify-content: space-between; align-items: center; gap: 12px;
                           background: #0b1220; border-radius: 10px; padding: 10px 12px; }
  #tables { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  button.sec { background: #334155; color: var(--txt); }
  button.danger { background: #ef4444; color: #fff; }
  #lobby, #game-view { padding-bottom: 24px; }
  #gv-title { color: var(--txt); font-size: 1.1rem; margin: 0; }
  #gv-status { text-align: center; font-weight: 600; margin: 8px 0 12px; min-height: 1.4em; }
  #gv-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  #toast { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 40;
           background: var(--ko); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: .9rem; }
  .waiting { list-style: none; margin: 0 auto; padding: 0; display: flex; flex-direction: column; gap: 6px; max-width: 320px; }
  .waiting li { background: #0b1220; border-radius: 10px; padding: 10px 14px; }
  button:disabled { opacity: .45; }
  [hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="games/connect4.css">
<link rel="stylesheet" href="games/chess.css">
<link rel="stylesheet" href="games/monopoly.css">
<link rel="stylesheet" href="games/impostor.css">
<link rel="stylesheet" href="cards.css">
<link rel="stylesheet" href="games/belote.css">
</head>
<body>
<header>
  <h1>✈️ Game Plane</h1>
  <span id="hstatus">
    <span id="status" class="ko">Connexion…</span>
    <button id="chat-toggle" type="button" aria-label="Ouvrir le chat" hidden>💬<span id="chat-badge" hidden>0</span></button>
  </span>
</header>

<section id="login-box">
  <form id="login">
    <input id="name" placeholder="Ton pseudo" maxlength="20" autocomplete="nickname" required>
    <button type="submit">Rejoindre</button>
  </form>
</section>

<div id="lobby" hidden>
  <section>
    <ul id="players"></ul>
    <p class="hint">Touche un joueur pour lui écrire en privé.</p>
  </section>
  <section>
    <h2>Jeux</h2>
    <div id="game-list" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
  <section id="open-tables" hidden>
    <h2>Parties ouvertes</h2>
    <ul id="tables"></ul>
  </section>
</div>

<div id="game-view" hidden>
  <h2 id="gv-title"></h2>
  <p id="gv-status"></p>
  <div id="gv-body"></div>
  <div id="gv-actions">
    <button id="gv-chat" type="button" class="sec">💬 Chat de la table</button>
    <button id="gv-rematch" type="button" hidden>Rejouer</button>
    <button id="gv-leave" type="button" class="sec">Quitter</button>
  </div>
</div>

<div id="toast" hidden></div>

<aside id="chat-panel" hidden>
  <div id="chat-head">
    <div id="chat-tabs"></div>
    <button id="chat-close" type="button" aria-label="Replier le chat">▾</button>
  </div>
  <div id="chat-log"></div>
  <div id="chat-typing"></div>
  <div id="chat-quick"></div>
  <form id="chat-form">
    <input id="chat-input" placeholder="Message…" maxlength="500" autocomplete="off">
    <button type="submit">Envoyer</button>
  </form>
</aside>

<script src="chat.js"></script>
<script src="games.js"></script>
<script src="games/connect4.js"></script>
<script src="games/chess.js"></script>
<script src="games/monopoly-board.js"></script>
<script src="games/monopoly.js"></script>
<script src="games/impostor.js"></script>
<script src="cards.js"></script>
<script src="games/president.js"></script>
<script src="games/eights.js"></script>
<script src="games/liar.js"></script>
<script src="games/belote.js"></script>
<script src="client.js"></script>
</body>
</html>
